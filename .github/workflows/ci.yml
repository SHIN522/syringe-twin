name: SyringeTwin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syringetwin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Build browser model bundle
        run: python tools/build_web.py
      - name: Check Python syntax
        run: python -m compileall -q twin tools tests launch.py streamlit_app.py dashboard_client.py dashboard_visuals.py
      - name: Check browser JavaScript syntax
        run: python -c "from pathlib import Path; import subprocess; [subprocess.run(['node', '--check', str(path)], check=True) for path in sorted(Path('web').glob('*.js'))]"
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Exercise Streamlit dashboard
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: .
        run: python tests/ui_smoke.py
